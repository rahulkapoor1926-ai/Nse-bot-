# LIVE paper session for the phone: the paper bots (ORB + Liquidity Sweep, one shared risk book),
# the FYERS options recorder and the Flask dashboard run in ONE GitHub Actions job, so the dashboard
# reads the bots' own files as they are written (no copy delay). A Cloudflare quick tunnel gives a
# public HTTPS address; the sign-in link goes only to your Telegram. Manual runs only.
#
# PAPER ONLY: the bot has no order code; config must say live_orders_enabled false or nothing starts.
# FYERS budget (free plan 5,000 calls/day): bots 2,250 each + recorder 450 = 4,950.
# Data freshness, stated honestly: the bots re-quote every 30 s, the recorder every 60 s; the page
# polls every 5 s and shows each value's own timestamp and a STALE flag.
name: live-session

on:
  workflow_dispatch:
    inputs:
      book:
        description: "Paper book: standard (validation gate) or forward (forward validation)"
        required: false
        default: standard
      until:
        description: "IST HH:MM to stop (blank = 15:35)"
        required: false

permissions:
  contents: write       # paper-state (bot files) and bot-control (dashboard controls)
  actions: read

concurrency:
  group: paper-day      # never two paper bots at once (one shared risk book)
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      TZ: Asia/Kolkata
      FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      BOT_CONTROL_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Flask (pinned)
        run: python3 -m pip install -q -r requirements-dashboard.txt

      - name: Config (paper only, real orders disabled)
        env:
          BOOK: ${{ github.event.inputs.book || 'standard' }}
        run: |
          cp config/paper.example.json config/paper.json
          python3 -c "import json; c=json.load(open('config/paper.json')); c['state_dir']='state/sweep'; json.dump(c, open('config/paper-sweep.json','w'), indent=2)"
          if [ "$BOOK" = "forward" ]; then
            for pair in "paper.json state/forward/orb" "paper-sweep.json state/forward/sweep"; do
              set -- $pair
              python3 -c "import json,sys; c=json.load(open('config/'+sys.argv[1])); c['state_dir']=sys.argv[2]; c['risk_state_dir']='state/forward/shared-risk'; c['forward_validation']=True; json.dump(c, open('config/'+sys.argv[1],'w'), indent=2)" "$1" "$2"
            done
          fi
          for c in config/paper.json config/paper-sweep.json; do
            python3 -m nse_bot --config $c validate-config
            python3 -c "import json,sys; c=json.load(open(sys.argv[1])); assert c['live_orders_enabled'] is False and c['data_source']=='fyers'; print(sys.argv[1], 'paper only, FYERS data, live_orders_enabled=false')" $c
          done

      - name: Tests
        run: scripts/test_all.sh > /tmp/tests.log 2>&1 || { tail -n 60 /tmp/tests.log; exit 1; }; grep -E "^Ran|^OK" /tmp/tests.log

      - name: Bot files (paper-state) and controls (bot-control)
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          if git fetch origin +refs/heads/paper-state:refs/remotes/origin/paper-state; then
            git worktree add state origin/paper-state
            git -C state checkout -B paper-state
          else
            git worktree add --orphan -b paper-state state
          fi
          printf 'instruments.csv\ninstruments-fyers.csv*\n*.part\nrecordings/\nsweep-recordings/\nfyers-recordings/\nsignal-study/\nlogs/\ndecisions/\neod-raw/\n.tmp-*\n' > state/.gitignore
          mkdir -p state/recordings state/sweep-recordings state/fyers-recordings state/logs state/sweep state/forward/orb state/forward/sweep state/shared-risk state/forward/shared-risk
          if git fetch -q origin +refs/heads/bot-control:refs/remotes/origin/bot-control; then
            git worktree add -q ctl origin/bot-control && git -C ctl checkout -q -B bot-control
          else
            git worktree add -q --orphan -b bot-control ctl
          fi

      - name: Restore private data (instrument list, logs)
        uses: actions/cache/restore@v4
        with:
          path: |
            state/instruments.csv
            state/instruments-fyers.csv
            state/instruments-fyers.csv.symbols.json
            state/recordings
            state/sweep-recordings
            state/logs
            state/decisions
            state/sweep/logs
            state/sweep/decisions
          key: private-state-${{ github.run_id }}
          restore-keys: private-state-

      - name: Restore FYERS recordings
        uses: actions/cache/restore@v4
        with:
          path: state/fyers-recordings
          key: fyers-recordings-${{ github.run_id }}
          restore-keys: fyers-recordings-

      - name: Restore the signal study (Backtest tab)
        uses: actions/cache/restore@v4
        with:
          path: state/signal-study
          key: signal-study-${{ github.run_id }}
          restore-keys: signal-study-

      - name: FYERS auth code shape (never prints the code)
        env:
          FYERS_AUTH_CODE: ${{ secrets.FYERS_AUTH_CODE }}
        run: python3 scripts/fyers_code_shape.py

      - name: FYERS login (token masked, kept only for this job)
        env:
          FYERS_SECRET_ID: ${{ secrets.FYERS_SECRET_ID }}
          FYERS_AUTH_CODE: ${{ secrets.FYERS_AUTH_CODE }}
        run: |
          python3 - <<'PY'
          import os
          from nse_bot.broker import fyers
          md = fyers.FyersReadOnly()
          info = md.login()
          print("::add-mask::%s" % md._token)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("FYERS_ACCESS_TOKEN=%s\n" % md._token)
          print("FYERS login ok (token masked)")
          PY

      - name: Start bots, recorder, dashboard and HTTPS tunnel
        env:
          GITHUB_TOKEN: ${{ github.token }}
          UNTIL_INPUT: ${{ github.event.inputs.until }}
        run: |
          UNTIL="${UNTIL_INPUT:-15:35}"; echo "UNTIL=$UNTIL" >> "$GITHUB_ENV"
          # paper bots (unchanged commands and limits as paper-day); ORB first builds today's symbol master
          nohup python3 -m nse_bot --config config/paper.json paper --refresh-master --until "$UNTIL" --every 30 \
            --max-calls-per-minute 22 --max-calls-per-second 2 --max-calls-per-day 2250 \
            --strategy config/strategies/orb15.example.json > orb.log 2>&1 &
          echo $! > orb.pid
          for i in $(seq 1 60); do [ -s state/instruments-fyers.csv.symbols.json ] && break; sleep 5; done
          nohup python3 -m nse_bot --config config/paper-sweep.json paper --master state/instruments-fyers.csv \
            --until "$UNTIL" --every 30 --max-calls-per-minute 22 --max-calls-per-second 2 --max-calls-per-day 2250 \
            --strategy config/strategies/sweep.example.json > sweep.log 2>&1 &
          echo $! > sweep.pid
          nohup python3 -m nse_bot --config config/paper.json fyers-record --master state/instruments-fyers.csv \
            --out state/fyers-recordings --until "$(python3 -c "import sys; h,m=map(int,sys.argv[1].split(':')); print('%02d:%02d' % min((h,m),(15,31)))" "$UNTIL")" \
            --max-calls-per-minute 4 --max-calls-per-second 2 --max-calls-per-day 450 > recorder.log 2>&1 &
          KEY=$(python3 -c "import secrets; print(secrets.token_urlsafe(32))")
          echo "::add-mask::$KEY"
          echo "DASH_KEY=$KEY" >> "$GITHUB_ENV"
          END="$UNTIL"; echo "END=$END" >> "$GITHUB_ENV"
          # no GITHUB_TOKEN for Flask: "Start" is off here (the bots already run in this job)
          env -u GITHUB_TOKEN DASH_KEY="$KEY" DASH_STATE_ROOT=state DASH_CONTROL_DIR=ctl DASH_RECORDINGS=state/fyers-recordings \
            DASH_STUDY=state/signal-study/study.json DASH_CONFIG=config/paper.json DASH_HOST=127.0.0.1 DASH_PORT=8080 \
            nohup python3 -m nse_bot.web.app > flask.log 2>&1 &
          curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/download/2024.12.2/cloudflared-linux-amd64 \
            || curl -fsSL -o cloudflared https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared && ./cloudflared --version
          nohup ./cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 > tunnel.log 2>&1 &
          URL=""
          for i in $(seq 1 60); do URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' tunnel.log | head -n1); [ -n "$URL" ] && break; sleep 2; done
          [ -n "$URL" ] || { echo "tunnel did not start"; tail -n 30 tunnel.log; exit 1; }
          echo "URL=$URL" >> "$GITHUB_ENV"
          echo "dashboard address (sign-in key not shown): $URL"
          ok=""
          for i in $(seq 1 45); do curl -fsS -m 10 "$URL/healthz" > /dev/null 2>&1 && { ok=1; break; }; sleep 4; done
          [ -n "$ok" ] || { echo "public address not reachable"; tail -n 20 tunnel.log flask.log; exit 1; }
          echo "verified over the public HTTPS address from this runner:"
          echo "  /healthz            -> $(curl -s -o /dev/null -w '%{http_code}' "$URL/healthz")"
          echo "  /api/overview no key -> $(curl -s -o /dev/null -w '%{http_code}' "$URL/api/overview") (must be 401)"
          echo "  /login wrong key    -> $(curl -s -o /dev/null -w '%{http_code}' "$URL/login?k=wrong") (must be 401)"
          echo "  /login right key    -> $(curl -s -c jar -o /dev/null -w '%{http_code}' "$URL/login?k=$KEY") (must be 303)"
          curl -s -b jar "$URL/api/overview" | python3 -c "import json,sys; d=json.load(sys.stdin); m=d['market']; r=d['risk']; print('  /api/overview signed in -> mode', d['mode'], '| market available', m.get('available'), '| spot', m.get('spot'), '| risk entries', r.get('entries'), '| ORB bot', (d['books'].get('ORB') or {}).get('bot', {}).get('status'))"
          curl -s -b jar "$URL/api/study" | python3 -c "import json,sys; d=json.load(sys.stdin); c=d.get('coverage') or {}; i=c.get('index') or {}; print('  /api/study signed in -> available', d.get('available'), '| generated', d.get('generated'), '| index 1m', i.get('first'), 'to', i.get('last'), i.get('sessions'), 'sessions | ORB signals', ((d.get('ORB') or {}).get('summary') or {}).get('signals'), '| Sweep signals', ((d.get('Sweep') or {}).get('summary') or {}).get('signals'), '| option P&L', (d.get('options_pnl') or {}).get('status'))"
          CHECKS=""
          for p in / /static/app.js /api/session /api/overview /api/market /api/signals /api/trades /api/performance /api/logs /api/reports /api/study; do
            c=$(curl -s -b jar -o /dev/null -w '%{http_code}' "$URL$p"); CHECKS="$CHECKS $p=$c"
          done
          echo "  signed-in pages over the public address:$CHECKS"
          # Visible on the run page while the job is still running (job logs are only readable afterwards).
          # The address alone gives no access: every page needs the sign-in key, sent only to Telegram.
          echo "::notice title=Dashboard address (sign-in key only in Telegram)::$URL up until $END IST"
          echo "::notice title=Dashboard checks over the public address::healthz=$(curl -s -o /dev/null -w '%{http_code}' "$URL/healthz") no-key=$(curl -s -o /dev/null -w '%{http_code}' "$URL/api/overview") wrong-key=$(curl -s -o /dev/null -w '%{http_code}' "$URL/login?k=wrong")$CHECKS"
          echo "::notice title=Backtest tab data::$(curl -s -b jar "$URL/api/study" | python3 -c "import json,sys; d=json.load(sys.stdin); i=(d.get('coverage') or {}).get('index') or {}; print('available', d.get('available'), 'generated', d.get('generated'), 'index 1m', i.get('first'), 'to', i.get('last'), i.get('sessions'), 'sessions; ORB signals', ((d.get('ORB') or {}).get('summary') or {}).get('signals'), 'Sweep signals', ((d.get('Sweep') or {}).get('summary') or {}).get('signals'), 'option P&L', (d.get('options_pnl') or {}).get('status'))")"
          # Status file on the bot-control branch: address + checks, so the run can be verified while it is
          # up. Never the sign-in key (that goes to Telegram only).
          STUDY=$(curl -s -b jar "$URL/api/study" | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps({'available': d.get('available'), 'generated': d.get('generated'), 'coverage': d.get('coverage'), 'ORB_signals': ((d.get('ORB') or {}).get('summary') or {}).get('signals'), 'Sweep_signals': ((d.get('Sweep') or {}).get('summary') or {}).get('signals'), 'options_pnl': (d.get('options_pnl') or {}).get('status')}))")
          URL="$URL" END="$END" CHECKS="$CHECKS" STUDY="$STUDY" RUN="$GITHUB_RUN_ID" python3 -c "import json,os,datetime; json.dump({'url': os.environ['URL'], 'up_until_ist': os.environ['END'], 'run_id': os.environ['RUN'], 'started_at': datetime.datetime.now().isoformat(timespec='seconds'), 'signed_in_checks': dict(x.split('=',1) for x in os.environ['CHECKS'].split()), 'study': json.loads(os.environ['STUDY']), 'sign_in_key': 'sent to Telegram only'}, open('ctl/dashboard.json','w'), indent=1)"
          git -C ctl add dashboard.json && git -C ctl commit -q -m "dashboard up $END IST" && \
            { for i in 1 2 3; do git -C ctl push -q origin HEAD:bot-control && break; git -C ctl pull -q --rebase origin bot-control; done; } || echo "status file not published"
          export URL END DASH_KEY="$KEY"      # GITHUB_ENV values only reach LATER steps
          python3 - <<'PY'
          import os
          from nse_bot import notify
          tok, chat = os.environ.get("TELEGRAM_BOT_TOKEN"), os.environ.get("TELEGRAM_CHAT_ID")
          url, key, end = os.environ["URL"], os.environ["DASH_KEY"], os.environ["END"]
          if not (tok and chat):
              print("Telegram secrets missing: the sign-in link cannot be delivered"); raise SystemExit(1)
          text = ("NIFTY paper bot dashboard is up until about %s IST.\nOpen in Chrome: %s/login?k=%s\n"
                  "New link every run. Paper only, real orders disabled." % (end, url, key))
          notify.telegram_transport(tok, chat, text)
          print("sign-in link sent to Telegram")
          PY


      - name: Run the session (save bot files every 5 minutes)
        run: |
          echo "live until $UNTIL IST at $URL"
          n=0
          while kill -0 "$(cat orb.pid)" 2>/dev/null || kill -0 "$(cat sweep.pid)" 2>/dev/null; do
            sleep 30; n=$((n+1))
            pgrep -f "nse_bot.web.app" > /dev/null || { echo "dashboard restarted"; DASH_STATE_ROOT=state DASH_CONTROL_DIR=ctl DASH_RECORDINGS=state/fyers-recordings DASH_STUDY=state/signal-study/study.json DASH_CONFIG=config/paper.json nohup python3 -m nse_bot.web.app >> flask.log 2>&1 & }
            [ $((n % 10)) -eq 0 ] && { scripts/save_state.sh || true; }
          done
          echo "--- ORB bot (tail) ---"; tail -n 15 orb.log
          echo "--- Sweep bot (tail) ---"; tail -n 15 sweep.log
          echo "--- recorder (tail) ---"; tail -n 5 recorder.log
          for c in config/paper.json config/paper-sweep.json; do
            python3 -m nse_bot --config $c risk-status || true
            python3 -m nse_bot --config $c report || true
          done
          python3 -m nse_bot --config config/paper.json notify-summary --also-config config/paper-sweep.json \
            --master state/instruments-fyers.csv || true

      - name: Save state
        if: always()
        run: |
          python3 -m nse_bot --config config/paper.json dashboard > /dev/null || true
          python3 -m nse_bot --config config/paper-sweep.json dashboard > /dev/null || true
          scripts/save_state.sh || true

      - name: Save private data
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state/instruments.csv
            state/instruments-fyers.csv
            state/instruments-fyers.csv.symbols.json
            state/recordings
            state/sweep-recordings
            state/logs
            state/decisions
            state/sweep/logs
            state/sweep/decisions
          key: private-state-${{ github.run_id }}

      - name: Save FYERS recordings
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state/fyers-recordings
          key: fyers-recordings-${{ github.run_id }}
