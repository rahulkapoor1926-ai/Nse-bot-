# Paper trading on GitHub Actions: read-only SAHI data, simulated fills only.
# No live orders are possible: the code has no order endpoint and the config
# refuses live mode. Secrets come from GitHub Secrets, never from files.
#
# A job may run at most 6 hours and the NSE session is 6 h 15 min, so the day
# is split in two. The concurrency group makes the second job wait for the
# first. Risk state, the paper ledger and recordings live on the `paper-state`
# branch and are saved after each job, so the lockout survives restarts.
name: paper-day

# Schedule paused on 2026-11-02 at jojo's request: no SAHI credentials will be
# provided. Manual runs still work if a read-only data key is ever added.
# To resume, restore:
#   schedule:
#     - cron: "35 3 * * 1-5"    # 09:05 IST, morning half (exits 12:15)
#     - cron: "40 6 * * 1-5"    # 12:10 IST, afternoon half (exits after the close)
on:
  workflow_dispatch:
    inputs:
      until:
        description: "IST time HH:MM to stop (blank = session close)"
        required: false

permissions:
  contents: write

concurrency:
  group: paper-day
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      TZ: Asia/Kolkata
      SAHI_KEY_ID: ${{ secrets.SAHI_KEY_ID }}
      SAHI_KEY_SECRET: ${{ secrets.SAHI_KEY_SECRET }}
      SAHI_TOTP: ${{ secrets.SAHI_TOTP }}
      FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Trading day?
        id: day
        run: |
          cp config/paper.example.json config/paper.json
          # independent book for sweep_reversal: own ledger, risk lockout and dashboard
          python3 -c "import json; c=json.load(open('config/paper.json')); c['state_dir']='state/sweep'; json.dump(c, open('config/paper-sweep.json','w'), indent=2)"
          python3 -m nse_bot --config config/paper.json validate-config
          python3 -m nse_bot --config config/paper-sweep.json validate-config
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime as dt
          from nse_bot import clock
          cal = clock.Calendar.load("nse_bot/data/nse_holidays.json")
          print("trading=%s" % str(cal.is_trading_day(clock.now_ist().date())).lower())
          PY

      - name: Restore state
        if: steps.day.outputs.trading == 'true'
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          if git fetch origin +refs/heads/paper-state:refs/remotes/origin/paper-state; then
            git worktree add state origin/paper-state
            git -C state checkout -B paper-state
          else
            git worktree add --orphan -b paper-state state
          fi
          # broker/exchange data, logs and full decision reports (quotes, candles) never
          # go to the public branch; only one-line decision summaries do
          printf 'instruments.csv\ninstruments-fyers.csv*\n*.part\nrecordings/\nsweep-recordings/\nlogs/\ndecisions/\neod-raw/\n.tmp-*\n' > state/.gitignore
          git -C state rm -r -q --cached --ignore-unmatch instruments.csv recordings sweep-recordings logs decisions sweep/logs sweep/decisions
          mkdir -p state/recordings state/sweep-recordings state/logs state/sweep

      - name: Restore private data (instrument list, recordings, logs)
        if: steps.day.outputs.trading == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            state/instruments.csv
            state/instruments-fyers.csv
            state/instruments-fyers.csv.symbols.json
            state/recordings
            state/sweep-recordings
            state/logs
            state/decisions
            state/sweep/logs
            state/sweep/decisions
          key: private-state-${{ github.run_id }}
          restore-keys: private-state-

      - name: Unit tests
        if: steps.day.outputs.trading == 'true'
        run: scripts/test_all.sh

      - name: Data source
        if: steps.day.outputs.trading == 'true'
        id: src
        run: echo "source=$(python3 -c "import json; print(json.load(open('config/paper.json'))['data_source'])")" >> "$GITHUB_OUTPUT"

      - name: FYERS login (token masked, kept only for this job)
        if: steps.day.outputs.trading == 'true' && steps.src.outputs.source == 'fyers'
        env:
          FYERS_SECRET_ID: ${{ secrets.FYERS_SECRET_ID }}
          FYERS_AUTH_CODE: ${{ secrets.FYERS_AUTH_CODE }}
        run: |
          python3 - <<'PY'
          import os
          from nse_bot.broker import fyers
          md = fyers.FyersReadOnly()
          info = md.login()
          print("::add-mask::%s" % md._token)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("FYERS_ACCESS_TOKEN=%s\n" % md._token)
          print("FYERS login ok (token masked); refresh token received: %s" % info["refresh_token_received"])
          PY

      - name: Paper trade (FYERS data)
        if: steps.day.outputs.trading == 'true' && steps.src.outputs.source == 'fyers'
        env:
          UNTIL_INPUT: ${{ github.event.inputs.until }}
        run: |
          if [ -n "$UNTIL_INPUT" ]; then UNTIL="$UNTIL_INPUT";
          elif [ "$(date +%H)" -lt 12 ]; then UNTIL=12:15; else UNTIL=15:35; fi
          echo "running until $UNTIL IST on FYERS data (free plan: 50 calls/min, 5,000/day shared)"
          ( while sleep 300; do scripts/save_state.sh || true; done ) &
          SAVER=$!
          # recorders are not run on FYERS: its call budget is kept for trading decisions
          python3 -m nse_bot --config config/paper.json paper --refresh-master --until "$UNTIL" --every 30 \
            --max-calls-per-minute 22 --max-calls-per-day 2400 \
            --strategy config/strategies/orb15-equity.example.json \
            --strategy config/strategies/orb15.example.json &
          ORB=$!
          for i in $(seq 1 60); do [ -s state/instruments-fyers.csv.symbols.json ] && break; sleep 5; done
          SPAPER=0
          python3 -m nse_bot --config config/paper-sweep.json paper --master state/instruments-fyers.csv \
            --until "$UNTIL" --every 30 --max-calls-per-minute 22 --max-calls-per-day 2400 \
            --strategy config/strategies/sweep.example.json || SPAPER=$?
          PAPER=0
          wait $ORB || PAPER=$?
          kill $SAVER 2>/dev/null || true
          for c in config/paper.json config/paper-sweep.json; do
            python3 -m nse_bot --config $c risk-status || true
            python3 -m nse_bot --config $c report || true
          done
          echo "ORB paper exit $PAPER, sweep paper exit $SPAPER"
          [ "$PAPER" -eq 0 ] && [ "$SPAPER" -eq 0 ]

      - name: Paper trade and record (SAHI data)
        if: steps.day.outputs.trading == 'true' && steps.src.outputs.source == 'sahi'
        env:
          UNTIL_INPUT: ${{ github.event.inputs.until }}
        run: |
          if [ -n "$UNTIL_INPUT" ]; then UNTIL="$UNTIL_INPUT";
          elif [ "$(date +%H)" -lt 12 ]; then UNTIL=12:15; else UNTIL=15:35; fi
          echo "running until $UNTIL IST"
          # dashboard data reaches GitHub every 5 minutes while the bot runs
          ( while sleep 300; do scripts/save_state.sh || true; done ) &
          SAVER=$!
          python3 -m nse_bot --config config/paper.json record --refresh-master --until "$UNTIL" &
          REC=$!
          sleep 20
          # 1m index/future bars + option snapshots: the real data the sweep gate needs
          python3 -m nse_bot --config config/paper.json record --sweep --out state/sweep-recordings \
            --until "$UNTIL" &
          SREC=$!
          # sweep_reversal in its own book, so its results never mix with ORB
          python3 -m nse_bot --config config/paper-sweep.json paper --until "$UNTIL" --every 30 \
            --strategy config/strategies/sweep.example.json &
          SWEEP=$!
          PAPER=0
          python3 -m nse_bot --config config/paper.json paper --until "$UNTIL" --every 30 \
            --strategy config/strategies/orb15-equity.example.json \
            --strategy config/strategies/orb15.example.json || PAPER=$?
          RECORD=0; SRECORD=0; SPAPER=0
          wait $REC || RECORD=$?
          wait $SREC || SRECORD=$?
          wait $SWEEP || SPAPER=$?
          kill $SAVER 2>/dev/null || true
          for c in config/paper.json config/paper-sweep.json; do
            python3 -m nse_bot --config $c risk-status || true
            python3 -m nse_bot --config $c report || true
          done
          echo "paper exit $PAPER, sweep paper exit $SPAPER, record exit $RECORD, sweep record exit $SRECORD"
          [ "$PAPER" -eq 0 ] && [ "$SPAPER" -eq 0 ] && [ "$RECORD" -eq 0 ] && [ "$SRECORD" -eq 0 ]

      - name: Save state
        if: always() && steps.day.outputs.trading == 'true'
        run: |
          python3 -m nse_bot --config config/paper.json dashboard > /dev/null || true
          python3 -m nse_bot --config config/paper-sweep.json dashboard > /dev/null || true
          scripts/save_state.sh

      - name: Save private data
        if: always() && steps.day.outputs.trading == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            state/instruments.csv
            state/instruments-fyers.csv
            state/instruments-fyers.csv.symbols.json
            state/recordings
            state/sweep-recordings
            state/logs
            state/decisions
            state/sweep/logs
            state/sweep/decisions
          key: private-state-${{ github.run_id }}
