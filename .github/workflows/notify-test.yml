# mode "test": sends one test message to your Telegram (no market data, no trading).
# mode "rehearsal": end-to-end check of every P&L notification with LIVE FYERS prices and a
#   throwaway paper ledger in a temp directory (never state/ or paper-state); market hours only,
#   needs today's FYERS_AUTH_CODE. Messages carry a REHEARSAL banner. See scripts/notify_rehearsal.py.
# Paper only either way: the bot has no order endpoint.
name: notify-test

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "test = one message; rehearsal = full flow on live FYERS prices (~12 min)"
        type: choice
        options: [test, rehearsal]
        default: test

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Kolkata
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Send a test notification
        if: github.event.inputs.mode != 'rehearsal'
        run: |
          python3 - <<'PY'
          import sys, tempfile
          from nse_bot import clock
          from nse_bot.notify import Notifier
          now = clock.now_ist()
          n = Notifier(tempfile.mkdtemp(), now.date(), {"data_source": "fyers"})
          if n.channel != "telegram":
              print("TELEGRAM_BOT_TOKEN and/or TELEGRAM_CHAT_ID secret is missing (values are never printed)")
              sys.exit(2)
          ok = n.send("test", "NSE paper bot: test notification. P&L alerts will arrive here. "
                      "Paper trading only, no real orders.", now)
          print("delivered to Telegram" if ok else "NOT delivered: see the error above")
          sys.exit(0 if ok else 1)
          PY

      - name: Rehearse the full notification flow (live FYERS prices, throwaway ledger)
        if: github.event.inputs.mode == 'rehearsal'
        env:
          FYERS_APP_ID: ${{ secrets.FYERS_APP_ID }}
          FYERS_SECRET_ID: ${{ secrets.FYERS_SECRET_ID }}
          FYERS_AUTH_CODE: ${{ secrets.FYERS_AUTH_CODE }}
        run: python3 scripts/notify_rehearsal.py
